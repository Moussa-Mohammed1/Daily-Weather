services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alaric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alaricius}
      POSTGRES_DB: ${POSTGRES_DB:-weather}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${POSTGRES_USER:-alaric}:${POSTGRES_PASSWORD:-alaricius}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-daily-weather-development-secret}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-daily-weather-execution-jwt-secret}
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      PROJECT_ROOT: /opt/airflow/project
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alaric}:${POSTGRES_PASSWORD:-alaricius}@postgres:5432/weather
      API_URL: ${API_URL:-https://api.open-meteo.com/v1/forecast}
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./:/opt/airflow/project
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create --username \"$${AIRFLOW_ADMIN_USERNAME}\"
      --firstname Airflow --lastname Admin --role Admin
      --email admin@example.com --password \"$${AIRFLOW_ADMIN_PASSWORD}\" || true)"

  airflow-api-server:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: airflow api-server --port 8080
    ports:
      - "8080:8080"

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: airflow scheduler

  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: airflow dag-processor

  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: airflow triggerer

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alaric}:${POSTGRES_PASSWORD:-alaricius}@postgres:5432/weather
      API_URL: ${API_URL:-https://api.open-meteo.com/v1/forecast}
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
